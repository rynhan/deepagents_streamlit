services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Coolify}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://mlapi.run/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-6-luna}
      PPTX_SANDBOX_IMAGE: ${PPTX_SANDBOX_IMAGE:-pptx-sandbox:1}
      OPEN_SANDBOX_DOMAIN: ${OPEN_SANDBOX_DOMAIN:-opensandbox-server:8090}
      OPEN_SANDBOX_PROTOCOL: ${OPEN_SANDBOX_PROTOCOL:-http}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:?Set OPEN_SANDBOX_API_KEY in Coolify}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - opensandbox-server
    expose:
      - "8501"

  opensandbox-server:
    image: local/opensandbox-server:release-1.1.0
    build:
      context: .
      dockerfile: sandbox/OpenSandbox.Dockerfile
    restart: unless-stopped
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${OPEN_SANDBOX_API_KEY:?Set OPEN_SANDBOX_API_KEY in Coolify}
      OPENSANDBOX_DISABLE_METRICS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/var/lib/opensandbox
    expose:
      - "8090"

volumes:
  opensandbox-data:
