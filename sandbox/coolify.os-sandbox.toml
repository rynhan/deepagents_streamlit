[server]
host = "0.0.0.0"
port = 8090
max_sandbox_timeout_seconds = 86400

[proxy]
# The server container cannot route directly to sandbox container IPs.
resolve_internal = false

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
publish_host = "172.17.0.1"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096
seccomp_profile = ""

[ingress]
mode = "direct"

[renew_intent]
enabled = false
min_interval_seconds = 60
